<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAF7F2;
  --warm-white:#F5F0E8;
  --gold:#B8965A;
  --gold-light:#D4B07A;
  --gold-pale:#EDD9B4;
  --charcoal:#2C2820;
  --warm-gray:#7A7065;
  --border:rgba(184,150,90,0.25);
  --font-display:'Cormorant Garamond',serif;
  --font-body:'Jost',sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--charcoal);font-family:var(--font-body);font-weight:300;line-height:1.7;overflow-x:hidden}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:1.25rem 4rem;background:rgba(250,247,242,0.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:var(--font-display);font-size:1.2rem;font-weight:400;letter-spacing:0.04em;color:var(--charcoal);text-decoration:none}
.nav-links{display:flex;gap:2.5rem;list-style:none}
.nav-links a{font-size:0.75rem;letter-spacing:0.13em;text-transform:uppercase;color:var(--warm-gray);text-decoration:none;transition:color 0.2s}
.nav-links a:hover{color:var(--gold)}

/* HERO */
.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.hero-left{display:flex;flex-direction:column;justify-content:center;padding:8rem 4rem 6rem 5rem;position:relative}
.hero-left::after{content:'';position:absolute;right:0;top:15%;bottom:15%;width:1px;background:linear-gradient(to bottom,transparent,var(--gold-pale),transparent)}
.hero-eyebrow{font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:1.5rem}
.hero-name{font-family:var(--font-display);font-size:clamp(3rem,5vw,5rem);font-weight:300;line-height:1.05;color:var(--charcoal);margin-bottom:1.25rem}
.hero-name em{font-style:italic;color:var(--gold)}
.hero-tagline{font-family:var(--font-display);font-size:1.1rem;font-weight:300;font-style:italic;color:var(--warm-gray);margin-bottom:2rem;letter-spacing:0.01em}
.hero-divider{width:48px;height:1px;background:var(--gold);margin-bottom:1.75rem}
.hero-desc{font-size:0.88rem;color:var(--warm-gray);max-width:360px;line-height:1.9;margin-bottom:2.5rem}
.btn{display:inline-flex;align-items:center;gap:0.75rem;padding:0.85rem 2rem;border:1px solid var(--gold);color:var(--gold);font-family:var(--font-body);font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;text-decoration:none;transition:all 0.3s;background:transparent;cursor:pointer}
.btn:hover{background:var(--gold);color:#fff}
.hero-right{position:relative;overflow:hidden;background:#2C2820}
.hero-img{width:100%;height:100%;object-fit:cover;object-position:center top;opacity:0.88;display:block}
.hero-img-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(250,247,242,0.18) 0%,transparent 40%),linear-gradient(to top,rgba(44,40,32,0.5) 0%,transparent 50%)}
.hero-location{position:absolute;bottom:2.5rem;left:2rem;font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,240,232,0.7)}

/* PORTFOLIO */
.portfolio{padding:6rem 5rem}
.section-label{font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--gold);margin-bottom:0.75rem}
.section-title{font-family:var(--font-display);font-size:clamp(2rem,3vw,2.8rem);font-weight:300;color:var(--charcoal);margin-bottom:3rem;line-height:1.2}
.tabs-row{display:flex;border-bottom:1px solid var(--border);margin-bottom:2.5rem;gap:0}
.tab-btn{font-family:var(--font-body);font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--warm-gray);background:none;border:none;border-bottom:2px solid transparent;padding:0.9rem 0;margin-right:2.5rem;margin-bottom:-1px;cursor:pointer;transition:all 0.25s}
.tab-btn:hover{color:var(--charcoal)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.tab-desc{font-family:var(--font-display);font-size:1rem;font-style:italic;color:var(--warm-gray);margin-bottom:2rem;max-width:560px;line-height:1.7}
.videos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
.video-card{background:var(--warm-white);border:1px solid var(--border);overflow:hidden;transition:transform 0.25s,box-shadow 0.25s}
.video-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(44,40,32,0.1)}
.video-embed{width:100%;aspect-ratio:16/9;border:none}
.video-placeholder{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#EDE5D5,#DDD3BE);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.75rem}
.play-ring{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--gold-light);display:flex;align-items:center;justify-content:center}
.placeholder-label{font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-light)}
.video-info{padding:1rem 1.25rem}
.video-title{font-size:0.88rem;font-weight:400;color:var(--charcoal);margin-bottom:0.2rem}
.video-sub{font-size:0.76rem;color:var(--warm-gray)}
.gallery-link{display:inline-flex;align-items:center;gap:0.5rem;margin-top:2rem;font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);text-decoration:none;border-bottom:1px solid var(--gold-pale);padding-bottom:2px;transition:border-color 0.2s}
.gallery-link:hover{border-color:var(--gold)}

/* ABOUT */
.about{padding:6rem 5rem;background:var(--warm-white);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.about-grid{display:grid;grid-template-columns:1fr 2fr;gap:5rem;align-items:start}
.about-sticky{position:sticky;top:6rem}
.about-quote{font-family:var(--font-display);font-size:1.5rem;font-weight:300;font-style:italic;color:var(--gold);line-height:1.5;border-left:2px solid var(--gold-pale);padding-left:1.5rem}
.about-body p{font-size:0.9rem;color:var(--warm-gray);margin-bottom:1.2rem;line-height:1.9}
.about-body strong{color:var(--charcoal);font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:0.6rem;margin-top:2rem}
.tag{font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);border:1px solid var(--border);padding:0.35rem 0.9rem}

/* CONTACT */
.contact{padding:6rem 5rem;background:var(--charcoal)}
.contact .section-label{color:var(--gold-light)}
.contact .section-title{color:var(--warm-white)}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:start}
.contact-intro{font-family:var(--font-display);font-size:1.05rem;font-style:italic;color:var(--gold-light);line-height:1.8}
.contact-items{display:flex;flex-direction:column;gap:1.75rem}
.contact-lbl{font-size:0.7rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);margin-bottom:0.2rem}
.contact-val{font-size:0.92rem;color:rgba(245,240,232,0.8)}
.contact-val a{color:rgba(245,240,232,0.8);text-decoration:none;border-bottom:1px solid rgba(184,150,90,0.3);padding-bottom:1px;transition:color 0.2s,border-color 0.2s}
.contact-val a:hover{color:var(--gold-light);border-color:var(--gold-light)}
.btn-light{border-color:rgba(212,176,122,0.5);color:var(--gold-light)}
.btn-light:hover{background:var(--gold-light);color:var(--charcoal)}

/* FOOTER */
footer{background:var(--charcoal);border-top:1px solid rgba(184,150,90,0.15);padding:2rem 5rem;display:flex;justify-content:space-between;align-items:center}
.footer-copy{font-size:0.75rem;color:rgba(122,112,101,0.7);letter-spacing:0.06em}
.footer-nav{display:flex;gap:2rem;list-style:none}
.footer-nav a{font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(122,112,101,0.7);text-decoration:none;transition:color 0.2s}
.footer-nav a:hover{color:var(--gold)}

/* FADE IN */
.fade-in{opacity:0;transform:translateY(20px);transition:opacity 0.7s ease,transform 0.7s ease}
.fade-in.visible{opacity:1;transform:none}

/* ── MOBILE ───────────────────────────────────────────────── */
@media(max-width:768px){

  /* prevent any horizontal scroll */
  html,body{overflow-x:hidden;width:100%}

  /* nav */
  nav{padding:1rem 1.25rem}
  .nav-links{gap:1rem}
  .nav-links a{font-size:0.68rem;letter-spacing:0.08em}

  /* hero — narrow photo on right, text on left */
  .hero{grid-template-columns:1fr;min-height:100vh;position:relative}
  .hero-left{padding:7rem 1.25rem 3rem;order:1;position:relative;z-index:2;background:transparent;width:68%}
  .hero-left::after{display:none}
  .hero-right{position:absolute;top:0;right:0;bottom:0;width:32%;height:100%}
  .hero-right .hero-img{object-position:right top}
  .hero-desc{max-width:100%}

  /* portfolio */
  .portfolio{padding:3.5rem 1.25rem}
  .tab-btn{margin-right:1.25rem;font-size:0.72rem}
  .tab-desc{font-size:0.88rem;margin-bottom:1.25rem}

  /* videos — centered, 80% wide */
  .videos-grid{grid-template-columns:1fr;gap:1.5rem;width:80%;margin:0 auto}

  /* about */
  .about{padding:3.5rem 1.25rem}
  .about-grid{grid-template-columns:1fr;gap:2rem}
  .about-sticky{position:static}

  /* contact */
  .contact{padding:3.5rem 1.25rem}
  .contact-grid{grid-template-columns:1fr;gap:2.5rem}

  /* footer */
  footer{padding:1.5rem 1.25rem;flex-direction:column;gap:1rem;text-align:center}
  .footer-nav{flex-wrap:wrap;justify-content:center;gap:1rem}
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     All visible content is injected by JavaScript from content.js.
     To update text, videos, bio, or contact details — edit content.js.
     Never edit the text content inside this file directly.
     ═══════════════════════════════════════════════════════════════ -->

<nav>
  <a href="#" class="nav-logo" id="nav-logo"></a>
  <ul class="nav-links">
    <li><a href="#portfolio">Portfolio</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#contact">Contact</a></li>
    <!-- <li><a href="/sheet-music">Sheet Music</a></li> -->
  </ul>
</nav>

<section class="hero">
  <div class="hero-left">
    <p class="hero-eyebrow" id="hero-eyebrow"></p>
    <h1 class="hero-name" id="hero-name"></h1>
    <p class="hero-tagline" id="hero-tagline"></p>
    <div class="hero-divider"></div>
    <p class="hero-desc" id="hero-desc"></p>
    <a href="#contact" class="btn">Get in touch
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 7h10M7 2l5 5-5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
  <div class="hero-right">
    <img class="hero-img" id="hero-img" src="" alt="">
    <div class="hero-img-overlay"></div>
    <span class="hero-location" id="hero-location"></span>
  </div>
</section>

<section class="portfolio" id="portfolio">
  <div class="fade-in">
    <p class="section-label" id="portfolio-label"></p>
    <h2 class="section-title" id="portfolio-title"></h2>
  </div>
  <div class="tabs-row fade-in" id="tabs-row"></div>
  <div id="tab-panels"></div>
</section>

<section class="about" id="about">
  <div class="about-grid">
    <div class="about-sticky fade-in">
      <p class="section-label">About</p>
      <p class="about-quote" id="about-quote"></p>
    </div>
    <div class="about-body fade-in" id="about-body"></div>
  </div>
</section>

<section class="contact" id="contact">
  <div class="contact-grid">
    <div class="fade-in">
      <p class="section-label" id="contact-label"></p>
      <h2 class="section-title" id="contact-title"></h2>
      <p class="contact-intro" id="contact-intro"></p>
      <br><br>
      <a id="contact-email-btn" href="#" class="btn btn-light">Send an enquiry →</a>
    </div>
    <div class="contact-items fade-in" id="contact-items"></div>
  </div>
</section>

<footer>
  <p class="footer-copy" id="footer-copy"></p>
  <ul class="footer-nav">
    <li><a href="#portfolio">Portfolio</a></li>
    <li><a href="#about">About</a></li>
    <!-- <li><a href="/sheet-music">Sheet Music</a></li> -->
    <li><a href="#contact">Contact</a></li>
  </ul>
</footer>

<script src="content.js"></script>

<script>
// ─────────────────────────────────────────────────────────────────
//  RENDER HELPERS
// ─────────────────────────────────────────────────────────────────

const PLAY_ICON = `
  <div class="play-ring">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M4 2.5l8 4.5-8 4.5V2.5z" fill="#D4B07A"/>
    </svg>
  </div>`;

// Renders one video card.
// If youtube_id is filled in content.js → shows embedded YouTube player.
// If youtube_id is empty → shows a "Coming soon" placeholder.
function videoCard(video) {
  const media = video.youtube_id
    ? `<iframe class="video-embed"
         src="https://www.youtube.com/embed/${video.youtube_id}"
         allowfullscreen loading="lazy"></iframe>`
    : `<div class="video-placeholder">
         ${PLAY_ICON}
         <span class="placeholder-label">Coming soon</span>
       </div>`;
  return `
    <div class="video-card">
      ${media}
      <div class="video-info">
        <p class="video-title">${video.title}</p>
        <p class="video-sub">${video.subtitle}</p>
      </div>
    </div>`;
}

// Renders one full tab panel (description + video grid + gallery link).
function tabPanel(cat, isFirst) {
  const videos = cat.videos.map(videoCard).join('');
  return `
    <div id="${cat.id}" class="tab-panel fade-in ${isFirst ? 'active' : ''}">
      <p class="tab-desc">${cat.description}</p>
      <div class="videos-grid">${videos}</div>
      <a href="${cat.gallery_link}" class="gallery-link">See full gallery →</a>
    </div>`;
}

// Switches which tab is active.
function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.id === id);
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.id === id);
  });
}

// ─────────────────────────────────────────────────────────────────
//  MAIN — read CONTENT from content.js and populate the page
// ─────────────────────────────────────────────────────────────────

(function() {
  const c = CONTENT;
  {

    // Site title and nav logo
    document.title = c.site.title;
    document.getElementById('nav-logo').textContent = c.site.logo;

    // Hero
    document.getElementById('hero-eyebrow').textContent  = c.hero.eyebrow;
    document.getElementById('hero-name').innerHTML       = `${c.hero.name_line1}<br><em>${c.hero.name_line2}</em>`;
    document.getElementById('hero-tagline').textContent  = c.hero.tagline;
    document.getElementById('hero-desc').textContent     = c.hero.description;
    document.getElementById('hero-location').textContent = c.hero.location;
    const img = document.getElementById('hero-img');
    img.src = c.hero.photo;
    img.alt = c.hero.photo_alt;

    // Portfolio — tab buttons
    document.getElementById('portfolio-label').textContent = c.portfolio.section_label;
    document.getElementById('portfolio-title').textContent = c.portfolio.section_title;

    const tabsHTML = c.portfolio.categories.map((cat, i) => `
      <button class="tab-btn ${i === 0 ? 'active' : ''}"
              data-id="${cat.id}"
              onclick="switchTab('${cat.id}')">
        ${cat.tab_label}
      </button>`).join('');
    document.getElementById('tabs-row').innerHTML = tabsHTML;

    // Portfolio — tab panels with videos
    const panelsHTML = c.portfolio.categories
      .map((cat, i) => tabPanel(cat, i === 0)).join('');
    document.getElementById('tab-panels').innerHTML = panelsHTML;

    // About
    document.getElementById('about-quote').textContent = `"${c.about.quote}"`;
    const bioHTML  = c.about.bio.map(p => `<p>${p}</p>`).join('');
    const tagsHTML = c.about.tags.map(t => `<span class="tag">${t}</span>`).join('');
    document.getElementById('about-body').innerHTML = bioHTML + `<div class="tags">${tagsHTML}</div>`;

    // Contact
    document.getElementById('contact-label').textContent = c.contact.section_label;
    document.getElementById('contact-title').textContent = c.contact.section_title;
    document.getElementById('contact-intro').textContent = c.contact.intro;
    document.getElementById('contact-email-btn').href    = `mailto:${c.contact.email}`;

    const socialLinks = c.contact.social
      .map(s => `<a href="${s.url}">${s.label}</a>`)
      .join(' &nbsp;·&nbsp; ');

    document.getElementById('contact-items').innerHTML = `
      <div>
        <p class="contact-lbl">Email</p>
        <p class="contact-val"><a href="mailto:${c.contact.email}">${c.contact.email}</a></p>
      </div>
      <div>
        <p class="contact-lbl">WhatsApp / Phone</p>
        <p class="contact-val"><a href="${c.contact.phone_href}">${c.contact.phone_display}</a></p>
      </div>
      <div>
        <p class="contact-lbl">Based in</p>
        <p class="contact-val">
          ${c.contact.location}
          <br><span style="font-size:0.82rem;color:rgba(122,112,101,0.7)">${c.contact.location_sub}</span>
        </p>
      </div>
      <div>
        <p class="contact-lbl">Follow</p>
        <p class="contact-val">${socialLinks}</p>
      </div>`;

    // Footer
    document.getElementById('footer-copy').textContent = c.footer.copyright;

    // Fade-in scroll animation (runs after DOM is fully populated)
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    document.querySelectorAll('.fade-in').forEach(el => obs.observe(el));

    // On mobile: swap to ofer2.png, adjust opacity
    const heroImg = document.getElementById('hero-img');
    if (window.innerWidth <= 768 && c.hero.photo_mobile) {
      heroImg.src = c.hero.photo_mobile;
      heroImg.style.opacity = c.hero.photo_mobile_opacity || '0.88';
      heroImg.style.objectPosition = 'right top';
    }
  }
})();
</script>
</body>
</html>
